name: lichat

services:
  chat:
    image: ${IMAGE_REGISTRY:-}lichat:local
    build:
      context: .
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.ustc.edu.cn/pypi/simple}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.ustc.edu.cn/debian}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LICHAT_ENV: ${LICHAT_ENV:-dev}
      LICHAT_DATABASE_URL: ${LICHAT_DATABASE_URL:-sqlite+aiosqlite:////app/data/lichat.db}
      LICHAT_OIDC_ISSUER: ${LICHAT_OIDC_ISSUER:-https://account.lizf.cn}
      LICHAT_OIDC_CLIENT_ID: ${LICHAT_OIDC_CLIENT_ID:-li-chat-local}
      LICHAT_OIDC_CLIENT_SECRET: ${LICHAT_OIDC_CLIENT_SECRET:-}
      LICHAT_OIDC_REDIRECT_URI: ${LICHAT_OIDC_REDIRECT_URI:-http://localhost:8000/oidc/callback}
      LICHAT_OIDC_POST_LOGOUT_REDIRECT_URI: ${LICHAT_OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:8000/}
      LICHAT_OIDC_SCOPE: ${LICHAT_OIDC_SCOPE:-openid profile}
      LICHAT_SESSION_SECRET: ${LICHAT_SESSION_SECRET:-dev-only-change-me}
    ports:
      - "127.0.0.1:${LICHAT_PORT:-8000}:8000"
    volumes:
      - lichat-data:/app/data
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  lichat-data:
